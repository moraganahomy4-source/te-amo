<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TE AMO ❤️</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        background: black;
        font-family: Arial, sans-serif;
    }

    .heart {
        position: relative;
        width: 90vw;
        height: 80vh;
        max-width: 700px;
        max-height: 600px;
    }

    .words {
        position: absolute;
        inset: 0;
    }

    .word {
        position: absolute;
        transform: translate(-50%, -50%);
        color: #ff66c1;
        font-weight: bold;
        font-size: 12px;
        text-shadow: 0 0 8px #ff66c1;
        white-space: nowrap;
    }

    .center {
        position: absolute;
        left: 50%;
        top: 52%;
        transform: translate(-50%, -50%);
        color: #ff66c1;
        font-size: 55px;
        font-weight: bold;
        text-shadow: 0 0 15px #ff66c1;
        animation: pulse 1.4s infinite;
    }

    @keyframes pulse {
        50% {
            transform: translate(-50%, -50%) scale(1.12);
        }
    }
</style>
</head>

<body>

<div class="heart">
    <div class="words" id="words"></div>
    <div class="center">TE AMO</div>
</div>

<script>
const words = document.getElementById("words");

for (let i = 0; i < 240; i++) {

    const t = (i / 240) * Math.PI * 2;

    const x = 16 * Math.pow(Math.sin(t), 3);

    const y = 13 * Math.cos(t)
            - 5 * Math.cos(2 * t)
            - 2 * Math.cos(3 * t)
            - Math.cos(4 * t);

    const span = document.createElement("span");

    span.className = "word";
    span.textContent = "TE AMO";

    span.style.left = (50 + x * 2.8) + "%";
    span.style.top = (48 - y * 2.8) + "%";

    words.appendChild(span);
}
</script>

</body>
</html>
